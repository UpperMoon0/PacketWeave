plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    id 'maven-publish'
}
group = 'com.nstut'
version = mod_version
base { archivesName = 'packetweave-fabric-26.1.2' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
    withSourcesJar()
}
sourceSets.main.java.srcDir file('../../core/src/main/java')
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
}
processResources {
    inputs.property 'mod_version', version
    filesMatching('fabric.mod.json') { expand mod_version: version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
publishing { publications { mavenJava(MavenPublication) { artifactId = base.archivesName.get(); from components.java } } }

apply from: file('../../gradle/release-resources.gradle')
