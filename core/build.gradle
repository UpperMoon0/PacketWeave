plugins {
    id 'java-library'
}
group = 'com.nstut'
version = rootProject.mod_version
base { archivesName = 'packetweave-core' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
test { useJUnitPlatform() }
processResources {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE-PacketWeave' }
    }
}

// Run the same Java 8-compiled API/security/lifecycle suite on the oldest and
// newest requested game runtimes; no Minecraft installation is needed here.
[8, 25].each { runtime ->
    tasks.register("testJava${runtime}", Test) {
        description = "Runs the shared API suite on Java ${runtime}."
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(runtime)
        }
        useJUnitPlatform()
    }
}
