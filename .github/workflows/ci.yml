name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  plan:
    name: Validate release contracts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release tooling and verify target matrix
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 tools/verify_structure.py
      - id: plan
        run: python3 tools/release_contract.py plan
  core:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package loader-neutral core
        run: ./gradlew :core:build --no-daemon
      - name: Verify core production jar
        id: jar
        run: python3 tools/release_contract.py jar --target core --directory core/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: packetweave-core
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
  matrix:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native loader jar
        working-directory: targets/${{ matrix.target }}
        run: ./gradlew build --no-daemon --stacktrace
      - name: Verify production jar metadata and license
        id: jar
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tools/release_contract.py jar --target "$TARGET" --directory "targets/$TARGET/build/libs"
      - uses: actions/upload-artifact@v4
        with:
          name: packetweave-${{ matrix.target }}
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
